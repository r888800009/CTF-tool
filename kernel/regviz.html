<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register Visualizer</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #171b22;
    --panel2: #1e232c;
    --border: #2b323d;
    --text: #d7dee8;
    --muted: #8a94a3;
    --set: #2ea043;
    --set-bg: #123d1c;
    --field-bg: #1a2740;
    --field-fg: #7fb2ff;
    --clear-bg: #20262f;
    --reserved: #12151a;
    --accent: #4b9fff;
    --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    line-height: 1.5;
    padding: 24px 16px 80px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; margin-bottom: 24px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--set); box-shadow: 0 0 8px var(--set); }
  .dot.stale { background: var(--warn); }
  .hint { color: var(--muted); }
  code { background: var(--panel2); padding: 1px 6px; border-radius: 4px; color: var(--accent); }

  .reg {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 18px; margin-bottom: 20px;
    max-width: 1180px;
  }
  .reg-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
  .reg-name { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .reg-val { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 15px; color: var(--accent); }
  .reg-val.na { color: var(--warn); }
  .reg-desc { color: var(--muted); font-size: 13px; }

  table.bits { border-collapse: collapse; width: 100%; table-layout: fixed; margin-top: 6px; }
  table.bits td {
    border: 1px solid var(--border);
    text-align: center; padding: 4px 2px; cursor: default;
    background: var(--clear-bg); transition: background .1s;
    overflow: hidden;
  }
  td.bit .idx { font-size: 10px; color: var(--muted); display: block; }
  td.bit .mn  { font-size: 11px; font-weight: 600; display: block; min-height: 14px; white-space: nowrap; }
  td.bit.set   { background: var(--set-bg); }
  td.bit.set .mn { color: #7ee787; }
  td.bit.field { background: var(--field-bg); }
  td.bit.field .mn { color: var(--field-fg); }
  td.bit.reserved { background: var(--reserved); color: #3a4150; }
  td.bit.reserved .mn { color: #3a4150; }
  td.bit:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.bit.na { background: repeating-linear-gradient(45deg,#20262f,#20262f 6px,#171b22 6px,#171b22 12px); }

  .decode { margin-top: 10px; display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; }
  .decode .k { color: var(--muted); }
  .decode .v { font-family: ui-monospace, Consolas, monospace; color: var(--accent); }

  /* Page-table tree */
  .pt-wrap { max-width: 1180px; }
  .pt-wrap h2 { font-size: 16px; margin: 8px 0 6px; }
  .pt-hint { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .pt-node { margin-left: 0; }
  .pt-children { margin-left: 22px; border-left: 1px solid var(--border); padding-left: 10px; }
  .pt-row {
    font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
    padding: 3px 6px; border-radius: 6px; display: flex; gap: 10px;
    align-items: baseline; flex-wrap: wrap;
  }
  .pt-row.expandable { cursor: pointer; }
  .pt-row.expandable:hover { background: var(--panel2); }
  .pt-tw { color: var(--muted); width: 1.2em; display: inline-block; }
  .pt-idx { color: var(--field-fg); }
  .pt-val { color: var(--accent); }
  .pt-lvl { color: #7ee787; font-weight: 600; }
  .pt-va { color: var(--muted); }
  .pt-leaf .pt-lvl { color: var(--warn); }
  .pt-fl { color: var(--muted); }
  .pt-fl b { color: #7ee787; font-weight: 600; }
  .pt-err { color: var(--warn); font-size: 12.5px; padding: 4px 6px; }
  .pt-loading { color: var(--muted); font-size: 12.5px; padding: 4px 6px; }
  .pt-np { opacity: .42; }
  .pt-toolbar { font-size: 13px; color: var(--muted); margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pt-toolbar select {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 8px; font-size: 13px;
  }

  #tip {
    position: fixed; z-index: 50; pointer-events: none;
    background: #0b0e13; border: 1px solid var(--accent);
    border-radius: 8px; padding: 10px 12px; max-width: 340px;
    font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .08s;
  }
  #tip .t-name { font-weight: 700; color: #fff; margin-bottom: 3px; }
  #tip .t-state { margin: 6px 0; }
  #tip .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-weight: 600; font-size: 11px; }
  #tip .badge.set { background: var(--set-bg); color: #7ee787; border: 1px solid var(--set); }
  #tip .badge.clear { background: var(--clear-bg); color: var(--muted); border: 1px solid var(--border); }
  #tip .badge.field { background: var(--field-bg); color: var(--field-fg); border: 1px solid var(--accent); }
  #tip .t-desc { color: var(--muted); }
  #tip .t-reg { margin-top: 6px; font-family: ui-monospace, Consolas, monospace; color: var(--accent); font-size: 11.5px; }
</style>
</head>
<body>
  <h1 id="title">Register Visualizer</h1>
  <div class="sub">滑鼠移到任一 bit/field 上檢視解碼後的狀態。</div>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="status-text">尚未同步</span>
    <span class="hint" id="hint">— 在 gdb 下 <code>sync</code> 更新</span>
  </div>

  <div id="regs"></div>
  <div id="pt"></div>
  <div id="tip"></div>

  <!-- Per-arch register schema: sets window.REGS and window.REGVIZ_TITLE. -->
  <script src="/regs.js"></script>
  <script>
// ---- Shared rendering engine ---------------------------------------------
// A register schema entry (from /regs.js) may contain:
//   name  : string
//   desc  : string
//   width : number of bits to draw as a grid (chunked into rows of 32)
//   addr  : true to show the value padded to 16 hex digits (address-style)
//   flags : { bit: [mnemonic, description] }            single-bit flags
//   fields: [ { hi, lo, mn, desc, map? } ]              multi-bit fields
//   decode: (BigInt) => [ [label, valueString], ... ]   extra decoded lines
const REGS = window.REGS || [];
const CHUNK = 32;

const tip = document.getElementById("tip");
let current = {};   // name -> BigInt value (or null when unsynced/unreadable)

if (window.REGVIZ_TITLE) {
  document.getElementById("title").textContent = window.REGVIZ_TITLE;
  document.title = window.REGVIZ_TITLE;
}

function fieldAt(reg, bit) {
  if (!reg.fields) return null;
  for (const f of reg.fields) if (bit <= f.hi && bit >= f.lo) return f;
  return null;
}

function extract(v, hi, lo) {
  if (v === null || v === undefined) return null;
  const mask = (1n << BigInt(hi - lo + 1)) - 1n;
  return (v >> BigInt(lo)) & mask;
}

function buildTables() {
  const root = document.getElementById("regs");
  root.innerHTML = "";
  for (const reg of REGS) {
    const box = document.createElement("div");
    box.className = "reg";
    box.innerHTML =
      `<div class="reg-head">
         <span class="reg-name">${reg.name}</span>
         <span class="reg-val" id="val-${reg.name}">—</span>
       </div>
       <div class="reg-desc">${reg.desc || ""}</div>`;

    if (reg.width) {
      const table = document.createElement("table");
      table.className = "bits";
      // Draw high bits first, chunked into rows of 32 for readability.
      for (let top = reg.width - 1; top >= 0; top -= CHUNK) {
        const bottom = Math.max(0, top - CHUNK + 1);
        const tr = document.createElement("tr");
        let b = top;
        while (b >= bottom) {
          const field = fieldAt(reg, b);
          if (field && field.hi <= top && field.lo >= bottom) {
            const td = mkCell(reg, field.hi, field.lo, field, null);
            td.colSpan = field.hi - field.lo + 1;
            tr.appendChild(td);
            b = field.lo - 1;
          } else {
            const flag = reg.flags && reg.flags[b];
            tr.appendChild(mkCell(reg, b, b, field || null, flag || null));
            b -= 1;
          }
        }
        table.appendChild(tr);
      }
      box.appendChild(table);
    }

    if (reg.decode || (reg.addr && !reg.width)) {
      const d = document.createElement("div");
      d.className = "decode";
      d.id = "dec-" + reg.name;
      box.appendChild(d);
    }
    root.appendChild(box);
  }
}

function mkCell(reg, hi, lo, field, flag) {
  const td = document.createElement("td");
  const label = flag ? flag[0] : field ? field.mn : "";
  td.className = "bit" + (flag ? "" : field ? " field" : " reserved");
  const idx = hi === lo ? "" + hi : hi + ":" + lo;
  td.innerHTML = `<span class="idx">${idx}</span><span class="mn">${label}</span>`;
  td.dataset.reg = reg.name;
  td.dataset.hi = hi;
  td.dataset.lo = lo;
  td.addEventListener("mousemove", (e) => showTip(e, reg, hi, lo, field, flag));
  td.addEventListener("mouseleave", hideTip);
  return td;
}

function showTip(e, reg, hi, lo, field, flag) {
  const v = current[reg.name];
  const regHex = (v === null || v === undefined) ? "n/a" : ("0x" + v.toString(16));
  let title, desc, stateHtml;
  if (flag) {
    const st = (v === null || v === undefined) ? null : Number((v >> BigInt(lo)) & 1n);
    title = `${reg.name}.${flag[0]} (bit ${lo})`;
    desc = flag[1];
    stateHtml = st === null ? `<span class="badge clear">未同步 / 不可讀</span>`
      : st ? `<span class="badge set">1 · SET</span>`
           : `<span class="badge clear">0 · clear</span>`;
  } else if (field) {
    const val = extract(v, field.hi, field.lo);
    title = `${reg.name}.${field.mn} (bits ${field.hi}:${field.lo})`;
    desc = field.desc || "";
    if (val === null) {
      stateHtml = `<span class="badge clear">未同步 / 不可讀</span>`;
    } else {
      const mapped = field.map && field.map[val.toString()] !== undefined
        ? " · " + field.map[val.toString()] : "";
      stateHtml = `<span class="badge field">0x${val.toString(16)} (${val})${mapped}</span>`;
    }
  } else {
    title = `${reg.name} — bit ${lo} (reserved)`;
    desc = "Reserved — should read as 0; do not modify.";
    stateHtml = `<span class="badge clear">reserved</span>`;
  }
  tip.innerHTML =
    `<div class="t-name">${title}</div>
     <div class="t-state">${stateHtml}</div>
     <div class="t-desc">${desc}</div>
     <div class="t-reg">${reg.name} = ${regHex}</div>`;
  tip.style.opacity = "1";
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = tip.getBoundingClientRect();
  if (x + r.width > window.innerWidth) x = e.clientX - r.width - pad;
  if (y + r.height > window.innerHeight) y = e.clientY - r.height - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = "0"; }

function render() {
  for (const reg of REGS) {
    const v = current[reg.name];
    const valEl = document.getElementById("val-" + reg.name);
    if (v === null || v === undefined) {
      valEl.textContent = "n/a";
      valEl.className = "reg-val na";
    } else {
      const pad = reg.addr ? 16 : Math.ceil((reg.width || 32) / 4);
      valEl.textContent = "0x" + v.toString(16).padStart(pad, "0");
      valEl.className = "reg-val";
    }
    document.querySelectorAll(`td.bit[data-reg="${reg.name}"]`).forEach((td) => {
      const hi = Number(td.dataset.hi), lo = Number(td.dataset.lo);
      const flag = td.classList.contains("reserved") ? null : true;
      td.classList.remove("na");
      if (v === null || v === undefined) { td.classList.add("na"); return; }
      if (td.classList.contains("field")) return;      // fields keep their tint
      if (td.classList.contains("reserved")) return;
      const st = Number((v >> BigInt(lo)) & 1n);
      td.classList.toggle("set", st === 1);
    });
    const dec = document.getElementById("dec-" + reg.name);
    if (dec) {
      if (v === null || v === undefined) {
        dec.innerHTML = `<span class="k">未同步</span>`;
      } else if (reg.decode) {
        const rows = reg.decode(v) || [];
        dec.innerHTML = rows.map(
          ([k, val]) => `<div><span class="k">${k}:</span> <span class="v">${val}</span></div>`
        ).join("");
      } else {
        dec.innerHTML = "";
      }
    }
  }
}

async function poll() {
  try {
    const r = await fetch("/data", { cache: "no-store" });
    const j = await r.json();
    for (const reg of REGS) {
      const raw = j.regs[reg.name];
      current[reg.name] = (raw === null || raw === undefined) ? null : BigInt(raw);
    }
    const dot = document.getElementById("dot");
    const txt = document.getElementById("status-text");
    const cmd = (j.prefix || "") + " sync";
    syncCmd = cmd.trim();
    document.getElementById("hint").innerHTML = `— 在 gdb 下 <code>${syncCmd}</code> 更新`;
    if (!j.synced) {
      dot.className = "dot"; txt.textContent = `尚未同步 — 請在 gdb 下 ${cmd.trim()}`;
    } else {
      const age = Date.now() / 1000 - j.synced_at;
      const when = new Date(j.synced_at * 1000).toLocaleTimeString();
      if (age > 5) { dot.className = "dot stale"; txt.textContent = `上次同步 ${when}（可能已過時）`; }
      else { dot.className = "dot live"; txt.textContent = `已同步 ${when}`; }
    }
    render();
    updatePageTable();
  } catch (e) {
    document.getElementById("dot").className = "dot";
    document.getElementById("status-text").textContent = "無法連線到 gdb 伺服器";
  }
}

// ---- Optional page-table tree --------------------------------------------
// Driven entirely by window.REGVIZ_PAGETABLE (set per-arch in regs.js); when it
// is absent this whole section stays empty, so non-paging arches are unaffected.
// Config: { title, baseReg, baseMask, levels:[{name, shift, leaf?}],
//           flags:{bit:[mn,desc]}, presentBit?, largePageBit?, canonicalBit?,
//           entriesPerTable? }
const PT = window.REGVIZ_PAGETABLE || null;
let syncCmd = "sync";
let ptLastBase = null;

function ptMask() { return BigInt(PT.baseMask); }
function hx(v) { return "0x" + v.toString(16); }

function canonical(va) {
  const bit = BigInt(PT.canonicalBit !== undefined ? PT.canonicalBit : 47);
  if ((va >> bit) & 1n) return va | (((1n << (63n - bit)) - 1n) << (bit + 1n));
  return va & ((1n << (bit + 1n)) - 1n);
}

function ptFlags(v) {
  const fl = PT.flags || {};
  return Object.keys(fl).map(Number).sort((a, b) => a - b)
    .filter((bit) => (v >> BigInt(bit)) & 1n)
    .map((bit) => `<b>${fl[bit][0]}</b>`).join(" ");
}

function buildPtSection() {
  if (!PT) return;
  const root = document.getElementById("pt");
  root.className = "pt-wrap";
  root.innerHTML =
    `<h2>${PT.title || "Page tables"}</h2>` +
    `<div class="pt-hint" id="pt-hint"></div>` +
    `<div class="pt-toolbar">每張表顯示：
       <select id="pt-count">
         <option value="present">只顯示 present</option>
         <option value="16">前 16 筆</option>
         <option value="32">前 32 筆</option>
         <option value="64">前 64 筆</option>
         <option value="128">前 128 筆</option>
         <option value="256">前 256 筆</option>
         <option value="512">全部 512 筆</option>
       </select>
     </div>` +
    `<div id="pt-root"></div>`;
  const sel = document.getElementById("pt-count");
  try { const s = localStorage.getItem("ptShowMode"); if (s) sel.value = s; } catch (e) {}
  sel.addEventListener("change", () => {
    try { localStorage.setItem("ptShowMode", sel.value); } catch (e) {}
    rerenderLoaded();
  });
}

function ptMode() {
  const sel = document.getElementById("pt-count");
  return sel ? sel.value : "present";
}

function rerenderLoaded() {
  document.querySelectorAll('.pt-children[data-loaded="1"]').forEach((c) => {
    if (c._entries) renderEntries(c);
  });
}

function updatePageTable() {
  if (!PT) return;
  const base = current[PT.baseReg];
  const hint = document.getElementById("pt-hint");
  const rootEl = document.getElementById("pt-root");
  if (base === null || base === undefined) {
    hint.textContent = `尚未同步 ${PT.baseReg} — 先在 gdb 下 ${syncCmd}`;
    rootEl.innerHTML = ""; ptLastBase = null; return;
  }
  const tableBase = base & ptMask();
  if (ptLastBase === tableBase) return;   // unchanged: keep the expanded tree
  ptLastBase = tableBase;
  hint.innerHTML =
    `${PT.baseReg} = <span class="pt-val">${hx(base)}</span> → ` +
    `${PT.levels[0].name} @ <span class="pt-val">${hx(tableBase)}</span>。` +
    `點擊節點逐層展開（透過 gdb monitor 讀實體記憶體）。`;
  rootEl.innerHTML = "";
  rootEl.appendChild(makeNode(headHtml(PT.levels[0].name, tableBase), tableBase, 0, 0n));
}

function headHtml(label, phys) {
  return `<span class="pt-tw">▸</span><span class="pt-lvl">${label}</span>` +
         ` @ <span class="pt-val">${hx(phys)}</span>`;
}

function makeNode(rowHtml, phys, level, vaAcc) {
  const node = document.createElement("div");
  node.className = "pt-node";
  const row = document.createElement("div");
  row.className = "pt-row expandable";
  row.innerHTML = rowHtml;
  const children = document.createElement("div");
  children.className = "pt-children";
  children.style.display = "none";
  node.appendChild(row); node.appendChild(children);
  row.addEventListener("click", () => togglePhys(row, children, phys, level, vaAcc));
  return node;
}

async function togglePhys(row, children, phys, level, vaAcc) {
  const tw = row.querySelector(".pt-tw");
  if (children.dataset.loaded) {
    const showing = children.style.display !== "none";
    children.style.display = showing ? "none" : "block";
    tw.textContent = showing ? "▸" : "▾";
    return;
  }
  children.style.display = "block"; tw.textContent = "▾";
  children.innerHTML = `<div class="pt-loading">讀取中…</div>`;
  let j;
  try {
    const n = PT.entriesPerTable || 512;
    const r = await fetch(`/mem?phys=${phys.toString(16)}&count=${n}`, { cache: "no-store" });
    j = await r.json();
  } catch (e) { children.innerHTML = `<div class="pt-err">讀取失敗：${e}</div>`; return; }
  if (!j.ok) { children.innerHTML = `<div class="pt-err">讀取失敗：${j.error}</div>`; return; }

  // Cache the raw table so the display-count menu can re-render without re-reading.
  children._entries = j.values;
  children._level = level;
  children._va = vaAcc;
  children.dataset.loaded = "1";
  renderEntries(children);
}

// Render one already-read table according to the display-count menu: either only
// present entries, or the first N entries (present or not) so the whole page
// directory's contents can be inspected.
function renderEntries(children) {
  const values = children._entries;
  const level = children._level;
  const vaAcc = children._va;
  const lvl = PT.levels[level];
  const shift = BigInt(lvl.shift);
  const presentBit = BigInt(PT.presentBit !== undefined ? PT.presentBit : 0);
  const mode = ptMode();
  const limit = mode === "present" ? values.length : Math.min(parseInt(mode, 10), values.length);

  children.innerHTML = "";
  let shown = 0, present = 0;
  for (let i = 0; i < values.length; i++) {
    if (mode !== "present" && i >= limit) break;
    const raw = values[i];
    const v = BigInt(raw);
    const isPresent = !!((v >> presentBit) & 1n);
    if (mode === "present" && !isPresent) continue;
    const va = canonical(vaAcc | (BigInt(i) << shift));

    if (!isPresent) {
      const d = document.createElement("div");
      d.className = "pt-row pt-np";
      d.innerHTML =
        `<span class="pt-tw"> </span><span class="pt-idx">[${i}]</span> ` +
        `<span class="pt-val">${raw}</span> <span class="pt-fl">not present</span> ` +
        `<span class="pt-va">VA ${hx(va)}</span>`;
      children.appendChild(d); shown++;
      continue;
    }
    present++; shown++;
    const isLast = !!lvl.leaf || level === PT.levels.length - 1;
    const isLarge = !isLast && PT.largePageBit !== undefined
      && ((v >> BigInt(PT.largePageBit)) & 1n);
    const nextBase = v & ptMask();
    if (isLast || isLarge) {
      const d = document.createElement("div");
      d.className = "pt-row pt-leaf";
      const kind = isLarge ? (lvl.name + " large page") : "4K page";
      d.innerHTML =
        `<span class="pt-tw"> </span><span class="pt-idx">[${i}]</span> ` +
        `<span class="pt-val">${raw}</span> <span class="pt-fl">${ptFlags(v)}</span> ` +
        `→ frame <span class="pt-val">${hx(nextBase)}</span> ` +
        `<span class="pt-va">VA ${hx(va)} (${kind})</span>`;
      children.appendChild(d);
    } else {
      const next = PT.levels[level + 1].name;
      const rowHtml =
        `<span class="pt-tw">▸</span><span class="pt-idx">[${i}]</span> ` +
        `<span class="pt-val">${raw}</span> <span class="pt-fl">${ptFlags(v)}</span> ` +
        `→ <span class="pt-lvl">${next}</span> @ <span class="pt-val">${hx(nextBase)}</span> ` +
        `<span class="pt-va">VA ${hx(va)}</span>`;
      children.appendChild(makeNode(rowHtml, nextBase, level + 1, va));
    }
  }
  if (shown === 0) {
    children.innerHTML = `<div class="pt-hint">（${mode === "present" ? "此表無 present entry" : "無 entry"}）</div>`;
  } else {
    const note = document.createElement("div");
    note.className = "pt-hint";
    note.textContent = mode === "present"
      ? `present ${present} 筆（共 ${values.length}）`
      : `顯示前 ${limit} / ${values.length} 筆（其中 present ${present} 筆）`;
    children.appendChild(note);
  }
}

buildTables();
buildPtSection();
poll();
setInterval(poll, 1000);
  </script>
</body>
