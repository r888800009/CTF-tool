<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISC-V trap vector</title>
<link rel="stylesheet" href="/regviz.css">
<style>
  .wrap { max-width: 1080px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .meta .mono { font-family: ui-monospace, Consolas, monospace; color: var(--accent); }
  .meta .mode { color: #7ee787; font-weight: 600; }
  .err { color: var(--warn); font-size: 13px; margin-bottom: 12px; }
  table.vec { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.vec th, table.vec td { border: 1px solid var(--border); padding: 5px 10px; text-align: left; vertical-align: top; }
  table.vec th { background: var(--panel); color: var(--muted); font-weight: 600; }
  table.vec td.name { white-space: nowrap; font-weight: 600; color: var(--text); }
  table.vec td.addr { font-family: ui-monospace, Consolas, monospace; white-space: nowrap; color: var(--field-fg); }
  table.vec td.tgt { font-family: ui-monospace, Consolas, monospace; white-space: nowrap; }
  table.vec td.tgt .tgt-link { color: #ff7b72; }
  pre.asm { margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--text); white-space: pre; }
  pre.asm .br { color: #ff7b72; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RISC-V trap vector</h1>
  <div class="sub">RISC-V S-mode trap 進入點（<code>stvec</code>，x86 IDT / arm64 VBAR 的對應）— 在 gdb 下 <code id="synccmd">stvecviz sync</code> 更新。點位址可反組譯。</div>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text">尚未同步</span></div>
  <div class="meta" id="meta"></div>
  <div class="err" id="err" style="display:none"></div>
  <table class="vec"><thead><tr><th>slot</th><th>entry</th><th>jump target</th><th>disassembly</th></tr></thead>
    <tbody id="body"></tbody></table>
</div>

<script src="/hexview.js"></script>
<script>
let entries = [], sig = "", meta = {};

function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function fmtAsm(lines) {
  return (lines || []).map((l) => {
    const e = esc(l);
    return /\b(jal|j|call|tail|b\w+)\b/.test(l) ? `<span class="br">${e}</span>` : e;
  }).join("\n");
}

function render() {
  const s = JSON.stringify(entries) + "|" + JSON.stringify(meta);
  if (s === sig) return;  // avoid wiping opened disassembly each poll
  sig = s;
  const tb = document.getElementById("body");
  tb.innerHTML = "";
  for (const v of entries) {
    const tr = document.createElement("tr");
    const tgt = v.target
      ? `<span class="tgt-link" data-addr="${v.target}">${v.target}</span>`
      : `<span style="color:var(--muted)">—</span>`;
    tr.innerHTML =
      `<td class="name">${esc(v.name)}${v.cause != null ? ` <span class="hint">cause ${v.cause}</span>` : ""}</td>` +
      `<td class="addr"><span class="ent-link" data-addr="${v.addr}">${v.addr}</span></td>` +
      `<td class="tgt">${tgt}</td>` +
      `<td><pre class="asm">${fmtAsm(v.asm)}</pre></td>`;
    tb.appendChild(tr);
  }
  tb.querySelectorAll(".ent-link").forEach((e) => hvDisasToggle(e, e.dataset.addr));
  tb.querySelectorAll(".tgt-link").forEach((e) => hvDisasToggle(e, e.dataset.addr));
}

async function poll() {
  try {
    const r = await fetch("/data", { cache: "no-store" });
    const j = await r.json();
    document.getElementById("synccmd").textContent = (j.prefix || "stvecviz") + " sync";
    const dot = document.getElementById("dot"), txt = document.getElementById("status-text");
    const err = document.getElementById("err"), mt = document.getElementById("meta");
    if (j.synced) {
      dot.className = "dot live";
      txt.textContent = "已同步 " + new Date(j.synced_at * 1000).toLocaleTimeString();
    } else {
      dot.className = "dot"; txt.textContent = "尚未同步（在 gdb 執行 stvecviz sync）";
    }
    if (j.error) { err.style.display = ""; err.textContent = j.error; } else { err.style.display = "none"; }
    mt.innerHTML = j.stvec
      ? `stvec <span class="mono">${j.stvec}</span> · BASE <span class="mono">${j.base}</span> · MODE <span class="mode">${j.mode_name}</span>` +
        (j.scause ? ` · scause <span class="mono">${j.scause}</span> sepc <span class="mono">${j.sepc}</span>` : "")
      : "";
    entries = j.entries || [];
    meta = { stvec: j.stvec, mode: j.mode_name, base: j.base };
    render();
  } catch (e) { /* server reloading */ }
}

poll();
setInterval(poll, 1500);
</script>
</body>
</html>
