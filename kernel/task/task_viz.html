<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task List</title>
<link rel="stylesheet" href="/regviz.css">
<style>
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .bar input { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 13px; min-width: 220px; }
  .count { color: var(--muted); font-size: 13px; }
  .err { color: var(--warn); font-size: 13px; margin-bottom: 12px; }
  table.ps { border-collapse: collapse; width: 100%; max-width: 760px; font-size: 13px; }
  table.ps th, table.ps td { border: 1px solid var(--border); padding: 5px 10px; text-align: right; white-space: nowrap; }
  table.ps th { background: var(--panel); position: sticky; top: 0; cursor: pointer; user-select: none; color: var(--muted); font-weight: 600; }
  table.ps th:hover { color: var(--text); }
  table.ps td { font-family: ui-monospace, Consolas, monospace; }
  table.ps td.comm, table.ps th.comm { text-align: left; color: var(--text); font-weight: 600; }
  table.ps td.node { color: var(--accent); }
  table.ps tr:hover td { background: var(--panel2); }
  table.ps tr.task { cursor: pointer; }
  table.ps tr.detail td { text-align: left; background: var(--bg); }
  .dhead { color: var(--muted); font-size: 12px; margin: 4px 0; }
  .dhead .mono { font-family: ui-monospace, Consolas, monospace; color: var(--accent); }
  .dctl { margin-left: 12px; }
  .dctl input { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; }
  .dctl .doff { width: 6em; } .dctl .dcount { width: 6em; }
  .dec-h { margin-top: 28px; font-size: 16px; }
  .dec-hint { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; }
  .dec-bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
  .dec-bar .sep { color: var(--border); }
  .dec-bar input, .dec-bar button, textarea#dec-hex, table.dec input, table.dec select, #dec-add {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 13px; font-family: ui-monospace, Consolas, monospace; }
  .dec-bar #dec-base { width: 16em; } .dec-bar #dec-addr { width: 14em; } .dec-bar #dec-count { width: 6em; }
  .dec-bar button, #dec-add { cursor: pointer; font-family: inherit; }
  textarea#dec-hex { width: 100%; max-width: 1180px; margin-bottom: 8px; box-sizing: border-box; }
  table.dec { border-collapse: collapse; max-width: 1180px; width: 100%; font-size: 12.5px; margin-bottom: 8px; }
  table.dec th, table.dec td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
  table.dec input.fname { width: 12em; } table.dec input.foff { width: 7em; }
  table.dec td.val { font-family: ui-monospace, Consolas, monospace; color: var(--accent); }
  table.dec .dim { color: var(--muted); }
  table.dec .rm { cursor: pointer; color: var(--warn); }
  .vmas { margin: 10px 0 4px; }
  .vma-body .dim { color: var(--muted); }
  .vma-body .vma-err { color: var(--warn); }
  .vma-mm { font-family: ui-monospace, Consolas, monospace; color: var(--accent); }
  table.vma { border-collapse: collapse; font-size: 12.5px; max-width: 760px; width: 100%; }
  table.vma th, table.vma td { border: 1px solid var(--border); padding: 3px 10px; text-align: right; white-space: nowrap; }
  table.vma th { background: var(--panel); color: var(--muted); font-weight: 600; }
  table.vma td { font-family: ui-monospace, Consolas, monospace; }
  table.vma td.va { color: var(--field-fg); }
  table.vma td.vaddr { color: var(--accent); }
  table.vma td.pm { color: #7ee787; letter-spacing: 1px; }
  table.vma td.dim { color: var(--muted); }
</style>
</head>
<body>
  <h1>Task List</h1>
  <div class="sub">從記憶體掃描出的 task_struct（行程）— 在 gdb 下 <code id="synccmd">taskviz sync</code> 更新。點欄位標題排序。</div>
  <div class="status"><span class="dot" id="dot"></span><span id="status-text">尚未同步</span></div>
  <div class="count" id="meta" style="margin-bottom:12px"></div>
  <div class="err" id="err" style="display:none"></div>
  <div class="bar">
    <input id="filter" type="text" placeholder="以名稱或 PID 過濾">
    <span class="count" id="count"></span>
  </div>
  <table class="ps"><thead id="thead"></thead><tbody id="tbody"></tbody></table>

  <h2 class="dec-h">task_struct 解析器（前端解值，offset 可調）</h2>
  <div class="dec-hint" id="dec-hint"></div>
  <div class="dec-bar">
    <label>base（offset 0 的位址）<input id="dec-base" type="text" value="0"></label>
    <span class="sep">|</span>
    <label>從記憶體讀取 addr <input id="dec-addr" type="text" placeholder="0xffff…（可填某列的 tasks node）"></label>
    <label>bytes <input id="dec-count" type="number" value="1024" min="16" max="8192"></label>
    <button id="dec-read">讀取</button>
    <button id="dec-fill">用偵測到的 offset 預填</button>
  </div>
  <textarea id="dec-hex" rows="5" placeholder="貼上 task_struct 的 hex（支援 hexdump / xxd / 0x.. / 連續 hex），或用上面的『讀取』從記憶體抓"></textarea>
  <table class="dec"><thead><tr><th>欄位</th><th>offset</th><th>type</th><th>value</th><th></th></tr></thead><tbody id="dec-body"></tbody></table>
  <button id="dec-add">+ 欄位</button>

<script src="/hexview.js"></script>
<script>
const COLS = [
  { k: "pid", label: "PID", num: true },
  { k: "comm", label: "comm", num: false },
  { k: "node", label: "tasks node", num: false },
];
let tasks = [], sortCol = "pid", sortDir = 1, filter = "", lastSig = "", lastMeta = {};
const expanded = new Set();   // task nodes whose task_struct hexdump is open
try { const f = localStorage.getItem("taskFilter"); if (f) filter = f; } catch (e) {}

function parseOff(s) {
  s = (s || "").trim();
  const neg = s.startsWith("-");
  if (neg) s = s.slice(1);
  let v;
  try { v = BigInt(s || "0"); } catch (e) { v = 0n; }
  return neg ? -v : v;
}

function buildHead() {
  const tr = document.createElement("tr");
  for (const c of COLS) {
    const th = document.createElement("th");
    th.textContent = c.label + (c.k === sortCol ? (sortDir > 0 ? " ▲" : " ▼") : "");
    if (c.k === "comm") th.className = "comm";
    th.addEventListener("click", () => {
      if (sortCol === c.k) sortDir = -sortDir; else { sortCol = c.k; sortDir = 1; }
      render(true);
    });
    tr.appendChild(th);
  }
  const t = document.getElementById("thead"); t.innerHTML = ""; t.appendChild(tr);
}

function cmp(a, b) {
  const col = COLS.find((c) => c.k === sortCol);
  let x = a[sortCol], y = b[sortCol];
  if (col.num) {
    x = (x === null || x === undefined) ? Infinity : x;
    y = (y === null || y === undefined) ? Infinity : y;
    return (x - y) * sortDir;
  }
  x = (x || "").toString().toLowerCase(); y = (y || "").toString().toLowerCase();
  return (x < y ? -1 : x > y ? 1 : 0) * sortDir;
}

function render(force) {
  buildHead();
  const f = filter.trim().toLowerCase();
  const rows = tasks.filter((t) =>
    !f || (t.comm || "").toLowerCase().includes(f) || String(t.pid).includes(f)).sort(cmp);
  const sig = JSON.stringify(rows) + sortCol + sortDir + f + "|" + [...expanded].join(",");
  if (!force && sig === lastSig) return;
  lastSig = sig;
  const tb = document.getElementById("tbody"); tb.innerHTML = "";
  for (const t of rows) {
    const tr = document.createElement("tr");
    tr.className = "task";
    const tw = expanded.has(t.node) ? "▾ " : "▸ ";
    tr.innerHTML =
      `<td>${t.pid === null || t.pid === undefined ? "—" : t.pid}</td>` +
      `<td class="comm">${tw}${(t.comm || "").replace(/</g, "&lt;") || "(anon)"}</td>` +
      `<td class="node">${t.node}</td>`;
    tr.addEventListener("click", () => {
      if (expanded.has(t.node)) expanded.delete(t.node); else expanded.add(t.node);
      render(true);
    });
    tb.appendChild(tr);
    if (expanded.has(t.node)) tb.appendChild(makeDetail(t));
  }
  document.getElementById("count").textContent = `${rows.length} / ${tasks.length} tasks`;
}

function makeDetail(t) {
  const tr = document.createElement("tr");
  tr.className = "detail";
  const td = document.createElement("td");
  td.colSpan = COLS.length;
  td.innerHTML =
    `<div class="dhead">task_struct near tasks node <span class="mono">${t.node}</span> ` +
    `<span class="dctl">from node <input class="doff" type="text" value="-0x100"> ` +
    `bytes <input class="dcount" type="number" min="16" max="8192" step="16" value="1024"></span></div>` +
    hvLegend() + `<pre class="hex">讀取中…</pre>` +
    `<div class="vmas"><div class="dhead">mm → vm_area_struct（記憶體掃描，等同 /proc/&lt;pid&gt;/maps）</div>` +
    `<div class="vma-body">讀取中…</div></div>`;
  tr.appendChild(td);
  const pre = td.querySelector(".hex"), off = td.querySelector(".doff"), cnt = td.querySelector(".dcount");
  const load = () => {
    const addr = "0x" + ((BigInt(t.node) + parseOff(off.value)) & ((1n << 64n) - 1n)).toString(16);
    const c = Math.max(16, Math.min(8192, parseInt(cnt.value, 10) || 1024));
    hvLoad(pre, addr, c);
  };
  for (const el of [off, cnt]) {
    el.addEventListener("click", (e) => e.stopPropagation());
    el.addEventListener("change", (e) => { e.stopPropagation(); load(); });
  }
  load();
  loadVmas(td.querySelector(".vma-body"), t);
  return tr;
}

function fmtSize(n) {
  n = Number(n);
  if (n >= 1 << 30) return (n / (1 << 30)).toFixed(1) + "G";
  if (n >= 1 << 20) return (n / (1 << 20)).toFixed(1) + "M";
  if (n >= 1 << 10) return (n / (1 << 10)).toFixed(0) + "K";
  return n + "B";
}

async function loadVmas(box, t) {
  if (!t.mm) { box.innerHTML = `<span class="dim">此 task 無 mm（kernel thread，或已結束）</span>`; return; }
  try {
    const r = await fetch(`/vmas?node=${encodeURIComponent(t.node)}`, { cache: "no-store" });
    const j = await r.json();
    if (!j.ok) { box.innerHTML = `<span class="vma-err">讀取失敗：${hvEsc(j.error || "")}</span>`; return; }
    if (j.note) { box.innerHTML = `<span class="dim">${hvEsc(j.note)}</span>`; return; }
    const vs = j.vmas || [];
    let h = `<div class="dim" style="margin-bottom:4px">mm <span class="vma-mm">${j.mm}</span> · ${vs.length} 個 VMA</div>`;
    if (!vs.length) { box.innerHTML = h + `<span class="dim">未掃到 VMA</span>`; return; }
    h += `<table class="vma"><thead><tr><th>vm_start</th><th>vm_end</th><th>size</th><th>perms</th><th>vm_flags</th><th>vm_area_struct</th></tr></thead><tbody>`;
    for (const v of vs) {
      h += `<tr><td class="va">${v.start}</td><td class="va">${v.end}</td>` +
           `<td class="sz">${fmtSize(v.size)}</td><td class="pm">${v.perms}</td>` +
           `<td class="dim">${v.flags}</td><td class="vaddr">${v.addr}</td></tr>`;
    }
    box.innerHTML = h + `</tbody></table>`;
  } catch (e) { box.innerHTML = `<span class="vma-err">讀取失敗：${hvEsc(String(e))}</span>`; }
}

async function poll() {
  try {
    const r = await fetch("/data", { cache: "no-store" });
    const j = await r.json();
    tasks = j.tasks || [];
    document.getElementById("synccmd").textContent = (j.prefix || "taskviz") + " sync";
    const dot = document.getElementById("dot"), txt = document.getElementById("status-text"), err = document.getElementById("err");
    if (j.error) { err.style.display = "block"; err.textContent = "讀取錯誤：" + j.error; }
    else { err.style.display = "none"; }
    const m = j.meta || {};
    lastMeta = m;
    document.getElementById("meta").textContent = m.head
      ? `init_task.tasks = ${m.head} · comm_delta=${m.comm_delta}${m.pid_delta != null ? ", pid_delta=" + m.pid_delta : ""}（純記憶體掃描）`
      : "";
    const dh = document.getElementById("dec-hint");
    if (dh) dh.textContent = m.head
      ? `提示：把某列的 tasks node 位址填入下方「讀取 addr」→ 讀取 → 按「用偵測到的 offset 預填」；`
        + `本次 comm_delta=${m.comm_delta}, pid_delta=${m.pid_delta}（皆相對 tasks node）。`
      : "貼上 task_struct 的 hex（或用「讀取」從記憶體抓），offset 相對於 base。";
    if (!j.synced) { dot.className = "dot"; txt.textContent = `尚未同步 — 請在 gdb 下 ${(j.prefix || "taskviz")} sync`; }
    else {
      const when = new Date(j.synced_at * 1000).toLocaleTimeString();
      dot.className = (Date.now() / 1000 - j.synced_at > 5) ? "dot stale" : "dot live";
      txt.textContent = `已同步 ${when}`;
    }
    render();
  } catch (e) {
    document.getElementById("dot").className = "dot";
    document.getElementById("status-text").textContent = "無法連線到 gdb 伺服器";
  }
}

document.getElementById("filter").value = filter;
document.getElementById("filter").addEventListener("input", (e) => {
  filter = e.target.value;
  try { localStorage.setItem("taskFilter", filter); } catch (err) {}
  render(true);
});

// ---- front-end task_struct decoder ---------------------------------------
const DEC_TYPES = ["u64", "u32", "u16", "u8", "s64", "s32", "ptr", "str"];
const DEC_READPAD = 0x800n;   // read this far before `addr` so negative offsets resolve
let decBytes = [], bufBaseVA = 0n;
let decFields = [
  { name: "tasks.next", off: "0x0", type: "ptr" },
  { name: "tasks.prev", off: "0x8", type: "ptr" },
  { name: "comm", off: "0x0", type: "str" },
  { name: "pid", off: "0x0", type: "u32" },
  { name: "tgid", off: "0x4", type: "u32" },
];
try { const s = localStorage.getItem("decFields"); if (s) decFields = JSON.parse(s); } catch (e) {}

function decRefVA() { try { return BigInt(document.getElementById("dec-base").value.trim() || "0"); } catch (e) { return 0n; } }
function decSave() { try { localStorage.setItem("decFields", JSON.stringify(decFields)); } catch (e) {} }
function decParseOff(s) {
  s = (s || "").trim(); const neg = s.startsWith("-"); if (neg) s = s.slice(1);
  let v; try { v = BigInt(s || "0"); } catch (e) { return null; }
  return neg ? -v : v;
}
function decHexToBytes(hex) { const a = []; for (let i = 0; i + 1 < hex.length; i += 2) a.push(parseInt(hex.substr(i, 2), 16)); return a; }
function parseHexBytes(text) {
  const out = [];
  for (let line of text.split(/\r?\n/)) {
    let s = line.trim(); if (!s) continue;
    s = s.replace(/^(0x)?[0-9a-fA-F]{4,}:\s*/, "");   // "ADDR:" prefix (xxd / gdb)
    s = s.replace(/^[0-9a-fA-F]{8,}\s+/, "");          // bare long-hex address (our dump)
    for (let t of s.split(/[\s,]+/)) {
      t = t.replace(/^0x/i, "").replace(/\\x/gi, "");
      if (t.length >= 2 && t.length % 2 === 0 && /^[0-9a-fA-F]+$/.test(t))
        for (let i = 0; i < t.length; i += 2) out.push(parseInt(t.substr(i, 2), 16));
    }
  }
  return out;
}
function decReadLE(idx, size) {
  if (idx < 0 || idx + size > decBytes.length) return null;
  let v = 0n; for (let k = size - 1; k >= 0; k--) v = (v << 8n) | BigInt(decBytes[idx + k]); return v;
}
function decValue(f) {
  const off = decParseOff(f.off);
  if (off === null) return { text: "(bad offset)" };
  const idx = Number((decRefVA() + off) - bufBaseVA);
  if (f.type === "str") {
    if (idx < 0 || idx >= decBytes.length) return { text: "—" };
    let s = "";
    for (let i = idx; i < decBytes.length && i < idx + 64; i++) {
      const c = decBytes[i]; if (c === 0) break;
      s += (c >= 32 && c < 127) ? String.fromCharCode(c) : ".";
    }
    return { text: s ? '"' + s + '"' : "—" };
  }
  const SZ = { u8: 1, u16: 2, u32: 4, u64: 8, s32: 4, s64: 8, ptr: 8 };
  const sz = SZ[f.type] || 8;
  const raw = decReadLE(idx, sz);
  if (raw === null) return { text: "—" };
  if (f.type === "ptr") {
    const cls = hvPtrClass(raw), hx = "0x" + raw.toString(16);
    return { html: cls ? `<span class="ptr ${cls}">${hx}</span>` : hx };
  }
  if (f.type === "s32" || f.type === "s64") {
    const bits = sz * 8; let v = raw;
    if (v >= (1n << BigInt(bits - 1))) v -= (1n << BigInt(bits));
    return { text: v.toString() + "  (0x" + raw.toString(16) + ")" };
  }
  return { text: raw.toString() + "  (0x" + raw.toString(16) + ")" };
}
function refreshValues() {
  const rows = document.getElementById("dec-body").children;
  decFields.forEach((f, i) => {
    const vc = rows[i] && rows[i].querySelector(".val"); if (!vc) return;
    const v = decValue(f);
    if (v.html) vc.innerHTML = v.html; else vc.textContent = v.text;
  });
}
function renderDecoder() {
  const tb = document.getElementById("dec-body"); tb.innerHTML = "";
  decFields.forEach((f, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td><input class="fname" value="${(f.name || "").replace(/"/g, "&quot;")}"></td>` +
      `<td><input class="foff" value="${f.off}"></td>` +
      `<td><select class="ftype">${DEC_TYPES.map(t => `<option${t === f.type ? " selected" : ""}>${t}</option>`).join("")}</select></td>` +
      `<td class="val"></td><td><span class="rm">✕</span></td>`;
    const v = decValue(f), vc = tr.querySelector(".val");
    if (v.html) vc.innerHTML = v.html; else vc.textContent = v.text;
    tr.querySelector(".fname").addEventListener("input", (e) => { f.name = e.target.value; decSave(); });
    tr.querySelector(".foff").addEventListener("input", (e) => { f.off = e.target.value; decSave(); refreshValues(); });
    tr.querySelector(".ftype").addEventListener("change", (e) => { f.type = e.target.value; decSave(); refreshValues(); });
    tr.querySelector(".rm").addEventListener("click", () => { decFields.splice(i, 1); decSave(); renderDecoder(); });
    tb.appendChild(tr);
  });
}
function decOff(n) { return n < 0 ? "-0x" + (-n).toString(16) : "0x" + n.toString(16); }
function initDecoder() {
  document.getElementById("dec-hex").addEventListener("input", (e) => {
    decHexReadMode = false;                 // pasted: byte 0 is at `base`
    decBytes = parseHexBytes(e.target.value); bufBaseVA = decRefVA(); refreshValues();
  });
  document.getElementById("dec-base").addEventListener("input", () => { if (!decHexReadMode) bufBaseVA = decRefVA(); refreshValues(); });
  document.getElementById("dec-add").addEventListener("click", () => { decFields.push({ name: "field", off: "0x0", type: "u64" }); decSave(); renderDecoder(); });
  document.getElementById("dec-read").addEventListener("click", async () => {
    let addr; try { addr = BigInt(document.getElementById("dec-addr").value.trim()); } catch (e) { return; }
    const cnt = Math.max(16, Math.min(8192, parseInt(document.getElementById("dec-count").value, 10) || 1024));
    bufBaseVA = addr - DEC_READPAD; decHexReadMode = true;
    document.getElementById("dec-base").value = "0x" + addr.toString(16);  // offsets relative to addr
    try {
      const r = await fetch(`/read?addr=${(bufBaseVA & ((1n << 64n) - 1n)).toString(16)}&count=${cnt + Number(DEC_READPAD)}`, { cache: "no-store" });
      const j = await r.json();
      if (!j.ok) { document.getElementById("dec-hint").textContent = "讀取失敗：" + j.error; return; }
      decBytes = decHexToBytes(j.hex);
      document.getElementById("dec-hex").value = j.hex;
      refreshValues();
    } catch (e) { document.getElementById("dec-hint").textContent = "讀取失敗：" + e; }
  });
  document.getElementById("dec-fill").addEventListener("click", () => {
    const cd = lastMeta.comm_delta, pd = lastMeta.pid_delta;
    const set = (name, off, type) => { let f = decFields.find((x) => x.name === name); if (!f) { f = { name, off, type }; decFields.push(f); } f.off = off; f.type = type; };
    set("tasks.next", "0x0", "ptr"); set("tasks.prev", "0x8", "ptr");
    if (cd !== undefined && cd !== null) set("comm", decOff(cd), "str");
    if (pd !== undefined && pd !== null) { set("pid", decOff(pd), "u32"); set("tgid", decOff(pd + 4), "u32"); }
    decSave(); renderDecoder();
  });
  renderDecoder();
}
let decHexReadMode = false;

buildHead();
initDecoder();
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
